<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bancada Lavadora</title>
<style>
:root { --bg: #0b1120; --card: #111827; --card-2: #1e293b; --text: #f8fafc; --muted: #94a3b8; --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --whatsapp: #22c55e; --border: #334155; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
.container { max-width: 920px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.badge { background: var(--card-2); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.id-box { background: var(--bg); border: 1px dashed var(--border); border-radius: 10px; padding: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.id-code { font-family: monospace; font-size: 1.05rem; font-weight: 700; color: #38bdf8; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
button { padding: 10px 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
.btn-primary { background: var(--primary); color: #fff; } .btn-success { background: var(--success); color: #fff; } .btn-secondary { background: var(--card-2); color: #fff; border: 1px solid var(--border); } .btn-whatsapp { background: var(--whatsapp); color: #052e16; }
.msg-ok { background: rgba(22,163,74,0.15); border: 1px solid var(--success); color: #86efac; padding:10px; border-radius:8px; margin-top:10px; } .msg-err { background: rgba(220,38,38,0.15); border: 1px solid var(--danger); color: #fca5a5; padding:10px; border-radius:8px; margin-top:10px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
<header><div><h1>Bancada Lavadora</h1><p>Diagnóstico de placas</p></div><div class="badge" id="statusBadge">Aguardando ativação</div></header>
<section id="gateSection" class="card">
<h2>Ativação do Aparelho</h2>
<div class="id-box">
<div><div style="font-size:0.78rem;color:#94a3b8;">ID gerado para este aparelho</div><div class="id-code" id="deviceIdDisplay">Gerando ID...</div></div>
<div class="btn-row">
<button type="button" class="btn-secondary" onclick="copiarIdAparelho()">Copiar ID</button>
<button type="button" class="btn-whatsapp" onclick="solicitarAcessoWhatsApp()">WhatsApp</button>
</div>
</div>
<div id="step1Box">
<input type="text" id="chaveInput" placeholder="Ex.: CHV-123456" />
<button type="button" class="btn-primary" onclick="validarChaveNivel1()" style="margin-top:10px;">Validar Chave</button>
</div>
<div id="step2Box" class="hidden" style="margin-top:14px;">
<div>Código 2FA: <strong id="codigo2faDisplay">------</strong></div>
<input type="text" id="tfaInput" maxlength="6" placeholder="6 dígitos" />
<div class="btn-row"><button type="button" class="btn-success" onclick="validar2faNivel2()">Entrar no App</button><button type="button" class="btn-secondary" onclick="voltarNivel1()">Voltar</button></div>
</div>
<div id="gateMsg"></div>
</section>
<main id="appSection" class="hidden">
<div class="card"><h2>App liberado! ✅</h2><p>Seu ID foi validado no Firebase + 2FA</p></div>
</main>
</div>

<script>
// SCRIPT 1 - ID QUE NUNCA TRAVA
const STORAGE_KEY_DEVICE_ID = "bancada_lavadora_device_id_v1";
const STORAGE_KEY_ADM_PASS = "bancada_lavadora_adm_pass_v1";
const WHATSAPP_NUMERO = "5561995534479";
const IDS_SEM_ATIVACAO = ["ID-78SW53X6"];
let codigo2faAtual="", chavePendenteNivel1="";
function obterOuCriarIdAparelho(){
  let id = localStorage.getItem(STORAGE_KEY_DEVICE_ID);
  if(!id){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let sufixo = ""; for(let i=0;i<8;i++) sufixo += chars.charAt(Math.floor(Math.random()*chars.length));
    id = "ID-" + sufixo; localStorage.setItem(STORAGE_KEY_DEVICE_ID, id);
  }
  return id.trim().toUpperCase();
}
function setMensagem(elId, texto, tipo){
  const el=document.getElementById(elId);
  if(!el) return; el.innerHTML='<div class="'+(tipo==="ok"?"msg-ok":"msg-err")+'">'+texto+'</div>';
}
function copiarIdAparelho(){
  const id=document.getElementById("deviceIdDisplay").textContent.trim();
  navigator.clipboard?.writeText(id); setMensagem("gateMsg","ID "+id+" copiado.","ok");
}
function solicitarAcessoWhatsApp(){
  const id=document.getElementById("deviceIdDisplay").textContent.trim();
  const texto="Olá! Meu ID: "+id; window.open("https://wa.me/"+WHATSAPP_NUMERO+"?text="+encodeURIComponent(texto),"_blank");
}
function liberarAplicacao(t){
  document.getElementById("gateSection").classList.add("hidden");
  document.getElementById("appSection").classList.remove("hidden");
  document.getElementById("statusBadge").textContent=t;
}
function voltarNivel1(){
  document.getElementById("step2Box").classList.add("hidden");
  document.getElementById("step1Box").classList.remove("hidden");
}
function validar2faNivel2(){
  const tfa=document.getElementById("tfaInput").value.trim();
  if(tfa!==codigo2faAtual){ setMensagem("gateMsg","2FA incorreto","err"); return; }
  liberarAplicacao("Acesso ativo");
}
(function initID(){
  const id=obterOuCriarIdAparelho();
  document.getElementById("deviceIdDisplay").textContent=id;
  if(IDS_SEM_ATIVACAO.includes(id)){ liberarAplicacao("Acesso direto"); }
})();
</script>

<script type="module">
// SCRIPT 2 - FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAQoBcq8ZX8n1Z55Qfr8x8E0Gb8jEZQl-k",
  authDomain: "bancada-lavadora-pro.firebaseapp.com",
  projectId: "bancada-lavadora-pro",
  storageBucket: "bancada-lavadora-pro.firebasestorage.app",
  messagingSenderId: "390758786240",
  appId: "1:390758786240:web:431f0d9214b4613be7b925"
};
const db = getFirestore(initializeApp(firebaseConfig));
window.validarChaveNivel1 = async function(){
  const id=document.getElementById("deviceIdDisplay").textContent.trim().toUpperCase();
  const chave=document.getElementById("chaveInput").value.trim().toUpperCase();
  if(!chave){ setMensagem("gateMsg","Informe a chave","err"); return; }
  setMensagem("gateMsg","Verificando no Firebase...","ok");
  try{
    const snap = await getDoc(doc(db,"clientes",id));
    if(!snap.exists()){ setMensagem("gateMsg","ID "+id+" não encontrado no Firebase","err"); return; }
    const d=snap.data();
    if(d.status==="Bloqueado"){ setMensagem("gateMsg","ID bloqueado","err"); return; }
    if(String(d.chave).toUpperCase()!==chave){ setMensagem("gateMsg","Chave inválida","err"); return; }
    chavePendenteNivel1=chave; codigo2faAtual=String(Math.floor(100000+Math.random()*900000));
    document.getElementById("codigo2faDisplay").textContent=codigo2faAtual;
    document.getElementById("step1Box").classList.add("hidden");
    document.getElementById("step2Box").classList.remove("hidden");
    setMensagem("gateMsg","Chave validada! Digite o 2FA","ok");
  }catch(e){ setMensagem("gateMsg","Erro Firebase: "+e.message,"err"); }
}
</script>
</body>
</html>
